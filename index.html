<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Airport Route Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    #map { width: 100%; height: 100vh; }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>

    // 1. 初始化地圖
    var map = L.map('map').setView([23.8, 120.9], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 12
    }).addTo(map);

    // 2. 全域變數
    let airports = {};
    let routes = [];
    let currentLines = [];

    // === 新增：航空公司顏色表 ===
    const airlineColors = {
      "IT": "#ff8800",
      "CI": "#003d79",
      "BR": "#007a3d",
      "JX": "#f4c542",
      "GK": "#8000ff"
    };

    function getAirlineColor(airlines) {
      return airlineColors[airlines[0]] || "#000000";
    }
    // ============================

    function clearLines() {
      currentLines.forEach(line => map.removeLayer(line));
      currentLines = [];
    }

    // 3. 載入機場資料
    fetch("airports.json?v=" + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        data.forEach(a => {
          airports[a.iata] = a;
        });
        loadRoutesAndMarkers(data);
      });

    function loadRoutesAndMarkers(airportList) {

      fetch("routes.json?v=" + new Date().getTime())
        .then(res => res.json())
        .then(r => {
          routes = r;

          airportList.forEach(airport => {
            if (!airport.lat || !airport.lng) return;

            L.marker([airport.lat, airport.lng])
              .addTo(map)
              .bindPopup(`
                <b>${airport.name}</b><br>
                IATA: ${airport.iata}<br>
                ICAO: ${airport.icao}<br>
                Country: ${airport.country}
              `)

              .on("click", () => {
                clearLines();

                let start = airport.iata;

                // 雙向航線
                let dests = routes.filter(r => r.from === start || r.to === start);

                dests.forEach(rt => {
                  let fromAirport, toAirport;

                  if (rt.from === start) {
                    fromAirport = airports[rt.from];
                    toAirport = airports[rt.to];
                  } else {
                    fromAirport = airports[rt.to];
                    toAirport = airports[rt.from];
                  }

                  if (!fromAirport || !toAirport) return;

                  // === 修改：使用航空公司顏色 ===
                  let lineColor = getAirlineColor(rt.airline);

                  let line = L.polyline(
                    [
                      [fromAirport.lat, fromAirport.lng],
                      [toAirport.lat, toAirport.lng]
                    ],
                    {
                      weight: 2,
                      color: lineColor,
                      opacity: 1
                    }
                  ).addTo(map);

                  currentLines.push(line);
                });
              });
          });
        });
    }

  </script>
</body>
</html>
